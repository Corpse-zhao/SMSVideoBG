name: Build KeyGen

on:
  push:
    branches: [ main, master ]
    paths: [ 'keygen/**', '.github/workflows/keygen.yml' ]
  workflow_dispatch:

jobs:
  build:
    # 激活码签发 App: 独立 deb, 与主插件分开分发 (只装在自己手机上)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Install iOS SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS14.5.sdk
          path: theos/sdks

      - name: Install dependencies
        run: |
          brew install make xz ldid
          gmake --version | head -1

      - name: Build package
        working-directory: keygen
        env:
          THEOS: ${{ github.workspace }}/theos
          # v10.5.0 与各插件共用同一 Secret —— 两版密钥一致, 签出的码才能通用
          # (兼容旧名: 新名没配时自动回退读 SVB_LICENSE_SECRET)
          VIDEOBG_LICENSE_SECRET: ${{ secrets.VIDEOBG_LICENSE_SECRET || secrets.SVB_LICENSE_SECRET }}
        run: |
          if [ -z "$VIDEOBG_LICENSE_SECRET" ]; then
            echo "::warning::VIDEOBG_LICENSE_SECRET 未配置 —— 本次用兜底密钥编译, 签出的码插件不会识别"
          else
            echo "✓ 密钥已注入 指纹 $(printf '%s' "$VIDEOBG_LICENSE_SECRET" | shasum -a 256 | cut -c1-8)"
          fi
          gmake package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Verify secret injected into binary
        working-directory: keygen
        env:
          VIDEOBG_LICENSE_SECRET: ${{ secrets.VIDEOBG_LICENSE_SECRET || secrets.SVB_LICENSE_SECRET }}
        run: |
          if [ -z "$VIDEOBG_LICENSE_SECRET" ]; then
            echo "::warning::未配置密钥, 跳过注入校验"
            exit 0
          fi
          bin=$(find .theos -type f -name SVBKeyGen 2>/dev/null | head -1)
          if [ -n "$bin" ]; then
            if grep -q "$VIDEOBG_LICENSE_SECRET" "$bin"; then
              echo "OK  $bin 已注入密钥"
            else
              echo "::error::密钥未能注入二进制"
              exit 1
            fi
          else
            echo "::error::未找到编译产物 SVBKeyGen"
            find .theos -maxdepth 4 -type f -name "SVBKeyGen*" 2>/dev/null
            exit 1
          fi

      - name: Inspect deb
        run: python3 tools/inspect_deb.py keygen/packages/*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyGen-deb
          path: keygen/packages/*.deb
          if-no-files-found: error
